                        <span>Setiap kali anda menekan butang, enjin membina frasa berbeza secara dinamik.</span>
                      </div>
                    </div>

                  </div>

                  {/* Rules Checklist Card */}
                  <div className="bg-white border-2 border-slate-200 rounded-xl p-4 text-xs text-slate-700 shadow-sm">
                    <div className="font-extrabold text-[#4358C6] mb-2.5 flex items-center gap-1.5">
                      <span>💖</span> Panduan Nada Suara Mesra Parent, Affiliate & Cikgu
                    </div>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-[11px]">
                      <div className="bg-slate-50 p-2 rounded-lg border-2 border-[#00B4D8] font-semibold">
                        <span className="text-[#00B4D8] font-extrabold">✓ Guna:</span> i, anak buah i, akak i, kawan office
                      </div>
                      <div className="bg-slate-50 p-2 rounded-lg border-2 border-[#FFB300] font-semibold">
                        <span className="text-[#FFB300] font-extrabold">✓ Guna:</span> stress, fobia, geram, termarah, PdP
                      </div>
                      <div className="bg-slate-50 p-2 rounded-lg border-2 border-[#F04134] font-semibold">
                        <span className="text-[#F04134] font-extrabold">✗ Elak:</span> "Anda" (terlalu kaku/formal)
                      </div>
                      <div className="bg-slate-50 p-2 rounded-lg border-2 border-[#7239C7] font-semibold">
                        <span className="text-[#7239C7] font-extrabold">✗ Elak:</span> "Oleh itu", "Kesimpulannya"
                      </div>
                    </div>
                  </div>

                </div>

              </div>
            )}

            {/* KANDUNGAN PAGE 2: IDEA DUMP */}
            {activeTab === 'ideadump' && (
              <div className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
                
                {/* Panel Kiri: Input Callout & Ruang Idea */}
                <div className="lg:col-span-5 bg-white border-2 border-slate-200 rounded-2xl p-4 sm:p-6 shadow-md flex flex-col gap-5">
                  <div className="flex items-center justify-between border-b-2 border-slate-100 pb-3">
                    <div className="flex items-center gap-2">
                      <span className="text-[#FF551C] font-bold text-xl">💡</span>
                      <h2 className="text-lg font-extrabold text-slate-800">Ruang Idea Dump</h2>
                    </div>
                    <span className="text-[11px] font-bold text-white bg-[#FF551C] px-3 py-1 rounded-full">
                      5 Angle Multiplier
                    </span>
                  </div>

                  {/* 1. Ruang Callout Sasaran Customer */}
                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-[#4358C6] mb-2 flex items-center justify-between">
                      <span className="flex items-center gap-1.5">
                        <span>🎯</span> 1. Callout Sasaran Customer (Target Audience)
                      </span>
                      <span className="text-[10px] text-slate-400 font-semibold">Wajib isi</span>
                    </label>
                    <input
                      type="text"
                      value={targetAudienceInput}
                      onChange={(e) => setTargetAudienceInput(e.target.value)}
                      placeholder="Contoh: Ibu suri rumah yang ada anak darjah 1..."
                      className="w-full bg-slate-50 border-2 border-slate-300 hover:border-[#4358C6] focus:border-[#4358C6] focus:bg-white rounded-xl px-3.5 py-3 text-sm text-slate-800 font-bold placeholder:text-slate-400 placeholder:font-normal transition-all shadow-sm focus:outline-none"
                    />
                    <div className="flex flex-wrap gap-1.5 mt-2">
                      {[
                        "Ibu suri rumah anak darjah 1",
                        "Working mom balik kerja penat",
                        "Mak-mak anak fobia sifir & darab",
                        "Parent anak ketagih main phone"
                      ].map((sample) => (
                        <button
                          key={sample}
                          type="button"
                          onClick={() => setTargetAudienceInput(sample)}
                          className="text-[10px] bg-slate-100 hover:bg-[#E0F2F4] text-slate-600 hover:text-[#00ABA9] font-bold px-2.5 py-1 rounded-lg border border-slate-200 transition-all"
                        >
                          + {sample}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* 2. Ruang Idea Mentah */}
                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-[#00ABA9] mb-2 flex items-center justify-between">
                      <span className="flex items-center gap-1.5">
                        <span>📝</span> 2. Ruang Idea Mentah Anda
                      </span>
                      <span className="text-[10px] text-slate-400 font-semibold">Tulis bebas</span>
                    </label>
                    <textarea
                      rows={5}
                      value={rawIdeaInput}
                      onChange={(e) => setRawIdeaInput(e.target.value)}
                      placeholder="Taip apa-apa idea spontan korang kat sini... Contoh: Anak sebenarnya tak malas tapi dorang takut bila tengok soalan teks panjang. Bila tukar ke visual gambar rajah terus laju dorang mengira."
                      className="w-full bg-slate-50 border-2 border-slate-300 hover:border-[#00ABA9] focus:border-[#00ABA9] focus:bg-white rounded-xl p-3.5 text-sm text-slate-800 font-semibold placeholder:text-slate-400 placeholder:font-normal transition-all shadow-sm focus:outline-none leading-relaxed"
                    ></textarea>
                  </div>

                  {/* Butang Jana 5 Angle */}
                  <button
                    type="button"
                    onClick={handleGenerateIdeaDump}
                    className={`w-full py-3.5 px-4 bg-[#FF551C] hover:bg-[#F04134] text-white font-extrabold rounded-xl shadow-md flex items-center justify-center gap-2 transition-all active:scale-95 border-2 border-[#FF551C] ${
                      isDumping ? 'opacity-80 scale-98' : ''
                    }`}
                  >
                    <span className={`text-lg ${isDumping ? 'animate-spin' : ''}`}>⚡</span>
                    <span className="tracking-wide text-white">Jana 5 Angle Content</span>
                  </button>

                  <div className="bg-slate-50 border-2 border-slate-200 rounded-xl p-3 text-xs text-slate-600 font-medium">
                    <span className="font-extrabold text-[#4358C6]">💡 Cara Guna:</span> Taip sasaran & idea mentah anda, tekan butang di atas. Sistem akan kembangkan kepada 5 sudut pandang (*angles*) berbeza secara automatik.
                  </div>
                </div>

                {/* Panel Kanan: Senarai 5 Angle & Preview Content Lengkap */}
                <div className="lg:col-span-7 flex flex-col gap-4">
                  
                  {/* Kad 5 Angle Pilihan */}
                  <div className="bg-white border-2 border-slate-200 rounded-2xl p-4 sm:p-6 shadow-md flex flex-col">
                    <div className="flex items-center justify-between border-b-2 border-slate-100 pb-3 mb-4">
                      <div className="flex items-center gap-2">
                        <span className="text-[#4358C6] font-bold text-lg">🔀</span>
                        <h3 className="font-extrabold text-slate-800 text-base sm:text-lg">5 Angle Content Unik</h3>
                      </div>
                      <span className="text-xs bg-[#FFEA3D] text-slate-900 px-3 py-1 rounded-full font-extrabold">
                        Klik mana-mana angle untuk kembangkan 👇
                      </span>
                    </div>

                    {generatedAngles.length > 0 ? (
                      <div className="space-y-2.5">
                        {generatedAngles.map((angle, idx) => (
                          <button
                            key={angle.id}
                            onClick={() => handleSelectAngle(idx)}
                            className={`w-full text-left p-3.5 rounded-xl border-2 transition-all flex flex-col gap-1.5 ${
                              selectedAngleIndex === idx
                                ? `bg-slate-50 ${angle.borderColor} shadow-md ring-2 ring-[#4358C6]/20`
                                : 'bg-slate-50 border-slate-200 hover:border-slate-300 opacity-90'
                            }`}
                          >
                            <div className="flex items-center justify-between">
                              <span className={`text-[10px] font-extrabold px-2.5 py-0.5 rounded-md ${angle.badgeColor}`}>
                                Angle #{idx + 1}: {angle.tag}
                              </span>
                              {selectedAngleIndex === idx && (
                                <span className="text-xs font-bold text-[#4358C6] flex items-center gap-1">
                                  <span>Sedang Dipaparkan</span>
                                  <span>✓</span>
                                </span>
                              )}
                            </div>
                            <div className="font-extrabold text-slate-800 text-sm sm:text-base leading-snug">
                              {angle.headline}
                            </div>
                            <div className="text-xs text-slate-500 font-medium">
                              {angle.coreThought}
                            </div>
                          </button>
                        ))}
                      </div>
                    ) : (
                      <div className="p-8 text-center text-slate-400 flex flex-col items-center justify-center">
                        <span className="text-4xl mb-2">💡</span>
                        <p className="text-sm font-bold text-slate-600">Belum ada angle dijana.</p>
                        <p className="text-xs text-slate-400 mt-1">Masukkan callout customer dan idea anda di panel kiri, kemudian tekan butang "Jana 5 Angle Content".</p>
                      </div>
                    )}
                  </div>

                  {/* Kad Output Kembangan Lengkap Bagi Angle Yang Dipilih */}
                  {expandedContent && (
                    <div className="bg-white border-2 border-slate-200 rounded-2xl p-4 sm:p-6 shadow-md flex flex-col gap-4">
                      <div className="flex flex-wrap items-center justify-between gap-3 border-b-2 border-slate-100 pb-3">
                        <div className="flex items-center gap-2">
                          <span className="text-[#38A854] font-bold text-lg">📄</span>
                          <h4 className="font-extrabold text-slate-800 text-base">
                            Kembangan Content Lengkap ({expandedContent.tag})
                          </h4>
                        </div>
                        <button
                          onClick={handleCopyExpanded}
                          className="flex items-center gap-1.5 px-3.5 py-1.5 bg-[#4358C6] hover:bg-[#3F51B5] text-white rounded-lg text-xs font-extrabold transition-all active:scale-95 shadow-sm"
                        >
                          {copiedDump ? (
                            <>
                              <span className="text-[#FFEA3D]">✓</span>
                              <span className="text-[#FFEA3D]">Tersalin!</span>
                            </>
                          ) : (
                            <>
                              <span>📋</span>
                              <span>Salin Content Ini</span>
                            </>
                          )}
                        </button>
                      </div>

                      {/* Bahagian 1: Hook */}
                      <div className="bg-slate-50 border-2 border-[#F04134] rounded-xl p-3.5">
                        <div className="text-[10px] font-extrabold text-white bg-[#F04134] inline-block px-2 py-0.5 rounded uppercase tracking-wider mb-1.5">
                          🔥 1. Hook 3 Saat Pertama
                        </div>
                        <p className="font-extrabold text-slate-900 text-sm sm:text-base">
                          {expandedContent.hook}
                        </p>
                      </div>

                      {/* Bahagian 2: Penceritaan */}
                      <div className="bg-slate-50 border-2 border-[#7239C7] rounded-xl p-3.5">
                        <div className="text-[10px] font-extrabold text-white bg-[#7239C7] inline-block px-2 py-0.5 rounded uppercase tracking-wider mb-1.5">
                          📖 2. Penceritaan Emosi & Isu Realiti
                        </div>
                        <p className="font-semibold text-slate-800 text-sm whitespace-pre-line leading-relaxed">
                          {expandedContent.story}
                        </p>
                      </div>

                      {/* Bahagian 3: Solusi Maths Klub */}
                      <div className="bg-slate-50 border-2 border-[#38A854] rounded-xl p-3.5">
                        <div className="text-[10px] font-extrabold text-white bg-[#38A854] inline-block px-2 py-0.5 rounded uppercase tracking-wider mb-1.5">
                          💡 3. Solusi Visual Maths Klub
                        </div>
                        <p className="font-semibold text-slate-800 text-sm leading-relaxed">
                          {expandedContent.solution}
                        </p>
                      </div>

                      {/* Bahagian 4: CTA */}
                      <div className="bg-slate-50 border-2 border-[#FFB300] rounded-xl p-3.5">
                        <div className="text-[10px] font-extrabold text-slate-900 bg-[#FFB300] inline-block px-2 py-0.5 rounded uppercase tracking-wider mb-1.5">
                          ✅ 4. Call To Action (CTA)
                        </div>
                        <p className="font-bold text-slate-800 text-sm">
                          {expandedContent.cta}
                        </p>
                      </div>

                      {/* Bahagian 5: Cadangan Media */}
                      <div className="bg-slate-50 border-2 border-[#00ABA9] rounded-xl p-3.5">
                        <div className="text-[10px] font-extrabold text-white bg-[#00ABA9] inline-block px-2 py-0.5 rounded uppercase tracking-wider mb-1.5">
                          🎬 5. Cadangan Visual / Media
                        </div>
                        <p className="font-semibold text-slate-700 text-xs sm:text-sm">
                          {expandedContent.media}
                        </p>
                      </div>
                    </div>
                  )}

                </div>

              </div>
            )}

          </div>

          {/* Footer Section */}
          <footer className="mt-8 pt-4 border-t-2 border-slate-200 text-center text-xs text-slate-400 font-bold">
            Kinder Klub ©️ | All Rights Reserved.
          </footer>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
